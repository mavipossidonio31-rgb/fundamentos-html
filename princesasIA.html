
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princesas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#ff99ff,#d66eff,#b84dff);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}

h1{
    color:white;
    margin:20px;
    text-shadow:
        0 0 10px white,
        0 0 20px pink,
        0 0 35px violet;
}

.div-imagens{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

/* Todas as imagens ficam iguais */
.img-pequena{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid white;

    /* Brilho */
    box-shadow:
        0 0 10px #fff,
        0 0 20px #ff66ff,
        0 0 40px #ff99ff,
        0 0 60px #ffffff;

    transition:0.4s;
    animation:glitter 2s infinite alternate;
}

/* Efeito ao passar o mouse */
.img-pequena:hover{
    transform:scale(1.08) rotate(2deg);
    box-shadow:
        0 0 20px white,
        0 0 40px gold,
        0 0 60px hotpink,
        0 0 80px violet;
}

/* Animação de glitter */
@keyframes glitter{
    0%{
        filter:brightness(1);
    }
    50%{
        filter:brightness(1.3);
    }
    100%{
        filter:brightness(1);
    }
}

</style>

</head>
<body>

<h1>✨ Princesas ✨</h1>

<div class="div-imagens">
    <img class="img-pequena" src="images1.jpg" alt="Imagem 1">
    <img class="img-pequena" src="images2.jpg" alt="Imagem 2">
    <img class="img-pequena" src="images3.jpg" alt="Imagem 3">
    <img class="img-pequena" src="images4.jpg" alt="Imagem 4">
</div>

</body>
</html>
